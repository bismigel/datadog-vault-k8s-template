{{- if .Values.devVault.enabled }}
{{- if .Values.devVault.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dd-vault.vaultSA" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dd-vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
{{- end }}
{{- end }}
