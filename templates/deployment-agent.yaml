apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dd-vault.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dd-vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dd-vault.fullname" . }}-agent
  template:
    metadata:
      labels:
        app: {{ include "dd-vault.fullname" . }}-agent
        {{- include "dd-vault.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "dd-vault.agentSA" . }}
{{- if eq .Values.datadog.vault.authType "kubernetes" }}
      initContainers:
        - name: wait-for-vault
          image: {{ .Values.datadog.image }}
          command: ["/bin/sh", "-c"]
          env:
            - name: VAULT_ADDR
              value: {{ include "dd-vault.vaultAddress" . | quote }}
            - name: VAULT_ROLE
              value: {{ .Values.datadog.vault.kubernetesRole | quote }}
          args:
            - |
              set -e
              echo "waiting for Vault..."
              until curl -fsS "$VAULT_ADDR/v1/sys/health" >/dev/null 2>&1; do sleep 2; done
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              echo "waiting for Vault Kubernetes auth..."
              until curl -s -X POST -H 'Content-Type: application/json' \
                -d "{\"role\":\"$VAULT_ROLE\",\"jwt\":\"$TOKEN\"}" \
                "$VAULT_ADDR/v1/auth/kubernetes/login" | grep -q '"client_token"'; do
                sleep 2
              done
              echo "Vault is ready for the Agent"
{{- else }}
      initContainers:
        - name: wait-for-vault
          image: {{ .Values.datadog.image }}
          command: ["/bin/sh", "-c"]
          env:
            - name: VAULT_ADDR
              value: {{ include "dd-vault.vaultAddress" . | quote }}
          args:
            - |
              set -e
              echo "waiting for Vault..."
              until curl -fsS "$VAULT_ADDR/v1/sys/health" >/dev/null 2>&1; do sleep 2; done
{{- end }}
      containers:
        - name: datadog-agent
          image: {{ .Values.datadog.image }}
          env:
            # The upstream container entrypoint requires DD_API_KEY even when
            # the Agent resolves api_key from Vault. The handle is resolved by
            # the native secret backend after the entrypoint gate.
            - name: DD_API_KEY
              value: {{ .Values.datadog.apiKey | quote }}
            - name: DD_LOG_LEVEL
              value: {{ .Values.datadog.logLevel | lower | quote }}
            - name: DD_PROCESS_AGENT_ENABLED
              value: "false"
            - name: DD_APM_ENABLED
              value: "false"
            - name: DD_LOGS_ENABLED
              value: "false"
          volumeMounts:
            - name: datadog-yaml
              mountPath: /etc/datadog-agent/datadog.yaml
              subPath: datadog.yaml
              readOnly: true
            - name: confd
              mountPath: /etc/datadog-agent/conf.d
              readOnly: true
          resources:
            {{- toYaml .Values.datadog.resources | nindent 12 }}
      volumes:
        - name: datadog-yaml
          configMap:
            name: {{ include "dd-vault.fullname" . }}-agent-config
        - name: confd
          configMap:
            name: {{ include "dd-vault.fullname" . }}-agent-config
            items:
              - key: http_check.yaml
                path: http_check.yaml
