{{- if and .Values.statusApi.enabled (not .Values.statusApi.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dd-vault.fullname" . }}-status-api-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dd-vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: status-api
type: Opaque
stringData:
  username: {{ .Values.statusApi.auth.username | quote }}
  password: {{ .Values.statusApi.auth.password | quote }}
{{- end }}
