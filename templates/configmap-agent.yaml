apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dd-vault.fullname" . }}-agent-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dd-vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
data:
  datadog.yaml: |
    api_key: {{ .Values.datadog.apiKey | quote }}
    site: {{ .Values.datadog.site }}
    hostname: {{ include "dd-vault.fullname" . }}-agent

    secret_backend_type: hashicorp.vault
    secret_backend_config:
{{ include "dd-vault.secretBackendConfig" . | indent 6 }}

    secret_refresh_interval: {{ .Values.datadog.secretRefreshInterval }}
    log_level: {{ .Values.datadog.logLevel }}
    process_agent_enabled: false
    trace_agent_enabled: false
{{ if .Values.httpCheck.enabled }}
  http_check.yaml: |
    instances:
      - name: status-api detail (Vault basic auth)
        url: {{ include "dd-vault.httpCheckURL" . }}
        timeout: 10
        username: ENC[/secret/http_check;username]
        password: ENC[/secret/http_check;password]
        tags:
          - env:demo
          - service:status-api
{{ end }}
