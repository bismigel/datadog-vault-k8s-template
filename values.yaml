# Default values for datadog-vault-k8s.

nameOverride: ""
fullnameOverride: ""

datadog:
  image: datadog/agent:7.85.0
  site: us5.datadoghq.com

  # This is an ENC handle, not the real API key. The Agent resolves it from
  # Vault. The container entrypoint still requires DD_API_KEY to be set, so it
  # is also passed as an environment variable in the deployment.
  apiKey: "ENC[/secret/datadog;api_key]"

  secretRefreshInterval: 60
  logLevel: INFO

  serviceAccount:
    create: true
    name: ""

  vault:
    # Used when devVault.enabled is false.
    address: ""          # e.g. https://vault.example.com:8200
    authType: kubernetes # kubernetes or token
    kubernetesRole: datadog-agent
    kubernetesMountPath: auth/kubernetes/login
    token: ""            # only when authType=token

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

statusApi:
  enabled: true
  image: ghcr.io/bismigel/status-api:latest
  auth:
    # Leave empty to let the chart create a demo Secret. The demo Vault seed
    # uses username/password below, so do not combine existingSecret with
    # devVault.seed unless the values are also set here.
    existingSecret: ""
    username: testuser
    password: testpass
  resources: {}

httpCheck:
  enabled: true
  path: /api/detail
  # Leave empty to use the in-chart status-api Service.
  # Set this when statusApi.enabled=false or when checking an external service.
  url: ""

devVault:
  # Development/demo only. Deploys a single Vault -dev server in this namespace
  # and seeds dummy secrets. Do not enable in production.
  enabled: false
  image: hashicorp/vault:1.21.2
  rootToken: root
  datadogApiKey: dummy-datadog-api-key
  seed: true

  serviceAccount:
    create: true
    name: ""

  tokenReview:
    # Required for Vault's Kubernetes auth method. The Vault ServiceAccount
    # needs system:auth-delegator to call TokenReview.
    createClusterRoleBinding: true

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
