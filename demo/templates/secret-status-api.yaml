apiVersion: v1
kind: Secret
metadata:
  name: status-api-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dd-vault-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: status-api
type: Opaque
stringData:
  username: {{ .Values.statusApi.auth.username | quote }}
  password: {{ .Values.statusApi.auth.password | quote }}
