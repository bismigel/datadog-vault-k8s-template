apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dd-vault-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
data:
  policy.hcl: |
    path "secret/data/*" {
      capabilities = ["read"]
    }
    path "sys/mounts" {
      capabilities = ["read"]
    }
