apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dd-vault-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: status-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-api
  template:
    metadata:
      labels:
        app: status-api
        {{- include "dd-vault-demo.labels" . | nindent 8 }}
        app.kubernetes.io/component: status-api
    spec:
      containers:
        - name: status-api
          image: {{ .Values.statusApi.image }}
          env:
            - name: STATUS_USER
              valueFrom:
                secretKeyRef:
                  name: status-api-auth
                  key: username
            - name: STATUS_PASS
              valueFrom:
                secretKeyRef:
                  name: status-api-auth
                  key: password
            - name: CHECKS_FILE
              value: /etc/status/checks.json
            - name: POLL_SECONDS
              value: "10"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: checks
              mountPath: /etc/status/checks.json
              subPath: checks.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            {{- toYaml .Values.statusApi.resources | nindent 12 }}
      volumes:
        - name: checks
          configMap:
            name: status-api-checks
