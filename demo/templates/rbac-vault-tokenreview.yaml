{{- if .Values.tokenReview.createClusterRoleBinding }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dd-vault-demo-{{ .Release.Namespace }}-vault-tokenreview
  labels:
    {{- include "dd-vault-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: {{ .Release.Namespace }}
{{- end }}
